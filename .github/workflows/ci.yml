name: CI

on:
  push:
    branches: [main, 'Security-Revamp-*']
  pull_request:
    branches: [main]

jobs:
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs lint
        run: python3 scripts/docs_lint.py

      - name: Check generated docs freshness
        run: python3 scripts/generate_docs_index.py --check

      - name: Lint feature inventory
        run: python3 scripts/feature_list_lint.py

      - name: Repo hygiene check
        run: python3 scripts/repo_hygiene_check.py

      - name: "Lint: deprecated datetime helpers banned in backend"
        run: python3 scripts/time_source_lint.py

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r src/backend/requirements.txt

      - name: Run backend tests
        run: bash scripts/run-backend-tests.sh -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Type check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: src/frontend
        run: npx vitest run

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        # setuptools>=83 patches PYSEC-2026-3447; the runner image ships an
        # older copy that pip-audit would flag when scanning the environment.
        run: pip install --upgrade "setuptools>=83" bandit pip-audit

      - name: Run Bandit
        # Exit-code-aware: bandit exits 0 (clean) or 1 (findings reported --
        # triaged below by security_gate.py's waiver process) when it ran
        # successfully; >=2 means bandit itself errored (bad invocation,
        # crash, could not write the report) -- verified empirically
        # (argparse error -> 2) against bandit 1.9.4. Only >=2 fails this
        # step; 0/1 must not be swallowed into "it ran" without evidence.
        # `|| code=$?` is required, not cosmetic: Actions runs `run` blocks
        # under `bash -e`, which aborts at a bare failing command before
        # `code=$?` could capture it -- so exit 1 would fail this step and
        # bypass the waiver process below.
        run: |
          code=0
          bandit -r src/backend/ -x src/backend/tests/ -f json -o bandit-report.json || code=$?
          if [ "$code" -ge 2 ]; then
            echo "Bandit exited $code: internal error, not merely findings. Failing the build."
            exit "$code"
          fi
          exit 0

      - name: Install backend dependencies for pip-audit
        run: pip install -r src/backend/requirements.txt

      - name: Run pip-audit
        # Same exit-code contract as bandit: 0 (clean) or 1 (vulnerabilities
        # found -- triaged below) is a successful run; >=2 means pip-audit
        # itself errored (bad invocation/crash) -- verified empirically
        # (argparse error -> 2) against pip-audit 2.10.1. Note: some
        # pip-audit internal errors (e.g. an unreadable requirements file)
        # were observed to exit 1, indistinguishable here from "vulnerabilities
        # found" -- that gap is covered by security_gate.py, which now fails
        # closed (exit 2) when the report it expects is missing or malformed.
        run: |
          code=0
          pip-audit --format=json --output=pip-audit-report.json || code=$?
          if [ "$code" -ge 2 ]; then
            echo "pip-audit exited $code: internal error, not merely findings. Failing the build."
            exit "$code"
          fi
          exit 0

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

      # Waiver process: to temporarily allow a known finding, add its test_id
      # (bandit) or vuln_id (pip-audit) to scripts/security_gate.py waivers list.
      # All waivers must have an owner and expiry date.
      - name: Security gate (fail on high/critical)
        run: python3 scripts/security_gate.py --bandit bandit-report.json --pip-audit pip-audit-report.json

  agent-evals:
    name: Agent Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r src/backend/requirements.txt

      - name: Agent eval gate (fail on advice leakage / ungrounded answers)
        run: python3 scripts/agent_eval_gate.py

  e2e-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r src/backend/requirements.txt

      - name: Run E2E tests
        working-directory: src/frontend
        run: npx playwright test --project chromium
        env:
          CI: true
