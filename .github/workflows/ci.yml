name: CI

on:
  push:
    branches: [main, 'Security-Revamp-*']
  pull_request:
    branches: [main]

jobs:
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs lint
        run: python3 scripts/docs_lint.py

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt

      - name: Run backend tests
        run: bash scripts/run-backend-tests.sh -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Type check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: src/frontend
        run: npx vitest run
