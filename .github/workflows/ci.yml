name: CI

on:
  push:
    branches: [main, 'Security-Revamp-*']
  pull_request:
    branches: [main]

jobs:
  docs-lint:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs lint
        run: python3 scripts/docs_lint.py

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt

      - name: Run backend tests
        run: bash scripts/run-backend-tests.sh -q

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Type check
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: src/frontend
        run: npx vitest run

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -r src/backend/ -x src/backend/tests/ -f json -o bandit-report.json || true

      - name: Run pip-audit
        run: pip install -r src/backend/requirements.txt && pip-audit --format=json --output=pip-audit-report.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

      # Waiver process: to temporarily allow a known finding, add its test_id
      # (bandit) or vuln_id (pip-audit) to scripts/security_gate.py waivers list.
      # All waivers must have an owner and expiry date.
      - name: Security gate (fail on high/critical)
        run: python3 scripts/security_gate.py --bandit bandit-report.json --pip-audit pip-audit-report.json

  agent-evals:
    name: Agent Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SQLCipher
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev

      - name: Install dependencies
        run: pip install -r src/backend/requirements.txt

      - name: Agent eval gate (fail on advice leakage / ungrounded answers)
        run: python3 scripts/agent_eval_gate.py

  e2e-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
          pip install -r src/backend/requirements.txt

      - name: Run E2E tests
        working-directory: src/frontend
        run: npx playwright test --project chromium
        env:
          CI: true
