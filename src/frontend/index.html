<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Pre-paint theme. Classic script so it runs before first paint. Mirrors
         resolveTheme() in src/theme/theme.ts (flag false = always light);
         UI-DARK-FLIP flips both together. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var enabled = false; // DARK_MODE_ENABLED
          if (enabled) {
            var pref = 'system';
            try {
              var v = window.localStorage.getItem('asclexis-theme');
              if (v === 'light' || v === 'dark' || v === 'system') pref = v;
            } catch (e) {}
            var osDark = false;
            try {
              osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            } catch (e) {}
            theme = pref === 'system' ? (osDark ? 'dark' : 'light') : pref;
          }
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Asclexis - Your personal medical results companion" />
    <!-- Theme color for browser UI (Chrome, Safari, Edge) - gracefully ignored by unsupported browsers -->
    <!-- Light only while dark mode is off; UI-DARK-FLIP adds the dark meta (#141412). -->
    <meta name="theme-color" content="#F6F5F1" />
    <!-- Apple-specific meta tags for iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Asclexis" />
    <!-- Microsoft tile color for Windows -->
    <meta name="msapplication-TileColor" content="#2D7D6F" />
    <title>Asclexis</title>
  </head>
  <body class="bg-surface text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
