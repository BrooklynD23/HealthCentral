# Alembic configuration for HealthCentral
#
# Dual migration setup:
# - [master]: Master database (profiles, audit logs, knowledge base)
# - [profile]: Per-profile SQLCipher encrypted vaults
#
# Usage:
#   alembic -n master upgrade head
#   alembic -n profile upgrade head  (requires runtime config for vault path/key)

[alembic]
# Template used for new migration scripts
script_location = migrations/master
# Default section - not directly used; specify -n master or -n profile

# Named configuration sections
[master]
script_location = migrations/master
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is set programmatically in env.py from settings
# sqlalchemy.url = sqlite:///data/asclexis.db

[profile]
script_location = migrations/profile
prepend_sys_path = .
version_path_separator = os

# Profile migrations require runtime configuration (vault path, encryption key)
# sqlalchemy.url is set programmatically in env.py

[post_write_hooks]
# No hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
