[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable safe linting categories
select = [
    "F",   # Pyflakes - logic errors
    "I",   # isort - import sorting
    "W",   # pycodestyle warnings
]

# Ignore rules that can break SQLAlchemy code
ignore = [
    "E712",  # Comparison to True/False - SQLAlchemy requires this
]

[tool.ruff.lint.per-file-ignores]
# Extra safety for files with SQLAlchemy boolean comparisons
"api/*.py" = ["E712"]
"models/*.py" = ["E712"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/profile_database.py" = ["F401", "I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/security.py" = ["F401", "I001", "W293"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/auth.py" = ["F401", "F841", "I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"modules/interpret_safety.py" = ["F541", "I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"modules/redaction.py" = ["F401", "I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"modules/faithfulness.py" = ["F841", "I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"modules/verifier_agent.py" = ["I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"security/__init__.py" = ["I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"api/profiles.py" = ["F401", "I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/audit.py" = ["I001"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/database.py" = ["W293"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/migrations.py" = ["F401"]
# E-3a: ask-first file, owner approval needed to fix (Q-RUFF-SET)
"core/external_runner.py" = ["I001"]
# E-3a: merged migrations are never edited (RUNBOOK §9.4)
"migrations/master/versions/001_initial_schema.py" = ["I001"]
"migrations/master/versions/002_backup_schedules.py" = ["I001"]
"migrations/profile/versions/001_initial_schema.py" = ["I001"]
