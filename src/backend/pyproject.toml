[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable safe linting categories
select = [
    "F",   # Pyflakes - logic errors
    "I",   # isort - import sorting
    "W",   # pycodestyle warnings
]

# Ignore rules that can break SQLAlchemy code
ignore = [
    "E712",  # Comparison to True/False - SQLAlchemy requires this
]

[tool.ruff.lint.per-file-ignores]
# Extra safety for files with SQLAlchemy boolean comparisons
"api/*.py" = ["E712"]
"models/*.py" = ["E712"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "models", "modules", "scripts"]

[tool.black]
line-length = 100
target-version = ["py311"]
